server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:../.env.local[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/mini_ctf}
    username: ${DATABASE_USERNAME:mini_ctf}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  datasource.hikari:
    maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
    minimum-idle: ${DB_POOL_MIN_IDLE:2}
    connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          github:
            client-id: ${GITHUB_CLIENT_ID:not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:not-configured}
            scope: read:user,user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          kakao:
            client-id: ${KAKAO_CLIENT_ID:not-configured}
            client-secret: ${KAKAO_CLIENT_SECRET:not-configured}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname,account_email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          naver:
            client-id: ${NAVER_CLIENT_ID:not-configured}
            client-secret: ${NAVER_CLIENT_SECRET:not-configured}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: name,email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  artifact:
    storage-root: ${ARTIFACT_STORAGE_ROOT:../challenges}
  profile:
    storage-root: ${PROFILE_STORAGE_ROOT:../profiles}
  oauth:
    success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:5173/auth/callback}

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
