server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:../.env.local[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/mini_ctf}
    username: ${DATABASE_USERNAME:mini_ctf}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    url: ${FLYWAY_URL:${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/mini_ctf}}
    user: ${FLYWAY_USERNAME:${DATABASE_USERNAME:mini_ctf}}
    password: ${FLYWAY_PASSWORD:${DATABASE_PASSWORD}}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  datasource.hikari:
    maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
    minimum-idle: ${DB_POOL_MIN_IDLE:2}
    connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: openid,profile,email
            redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/{registrationId}}
          github:
            client-id: ${GITHUB_CLIENT_ID:not-configured}
            client-secret: ${GITHUB_CLIENT_SECRET:not-configured}
            scope: read:user,user:email
            redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/{registrationId}}
          discord:
            client-id: ${DISCORD_CLIENT_ID:not-configured}
            client-secret: ${DISCORD_CLIENT_SECRET:not-configured}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: identify,email
            redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/{registrationId}}
          naver:
            client-id: ${NAVER_CLIENT_ID:not-configured}
            client-secret: ${NAVER_CLIENT_SECRET:not-configured}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: name,email
            redirect-uri: ${OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/{registrationId}}
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
            user-info-uri: ${GOOGLE_USER_INFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
            jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
            user-name-attribute: sub
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: ${GITHUB_TOKEN_URI:https://github.com/login/oauth/access_token}
            user-info-uri: ${GITHUB_USER_INFO_URI:https://api.github.com/user}
            user-name-attribute: id
          discord:
            authorization-uri: https://discord.com/oauth2/authorize
            token-uri: ${DISCORD_TOKEN_URI:https://discord.com/api/oauth2/token}
            user-info-uri: ${DISCORD_USER_INFO_URI:https://discord.com/api/users/@me}
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  artifact:
    storage-root: ${ARTIFACT_STORAGE_ROOT:../challenges}
  profile:
    storage-root: ${PROFILE_STORAGE_ROOT:../profiles}
    storage: ${PROFILE_STORAGE:local}
    s3:
      bucket: ${PROFILE_S3_BUCKET:}
      region: ${PROFILE_S3_REGION:ap-northeast-2}
      endpoint: ${PROFILE_S3_ENDPOINT:}
      access-key: ${PROFILE_S3_ACCESS_KEY:}
      secret-key: ${PROFILE_S3_SECRET_KEY:}
  retention:
    enabled: ${RETENTION_ENABLED:true}
    direct-messages-days: ${DIRECT_MESSAGE_RETENTION_DAYS:180}
    activity-events-days: ${ACTIVITY_EVENT_RETENTION_DAYS:90}
    security-events-days: ${SECURITY_EVENT_RETENTION_DAYS:365}
    anti-cheat-events-days: ${ANTI_CHEAT_EVENT_RETENTION_DAYS:365}
  oauth:
    success-redirect: ${OAUTH_SUCCESS_REDIRECT:http://localhost:5173/auth/callback}
    failure-redirect: ${OAUTH_FAILURE_REDIRECT:http://localhost:5173/auth/callback}

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html
