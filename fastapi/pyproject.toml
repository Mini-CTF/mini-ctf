[project]
name = "mini-ctf-internal-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic-settings==2.8.1",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
  "httpx==0.28.1",
  "ruff==0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
