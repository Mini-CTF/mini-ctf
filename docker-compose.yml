services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-ctf-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_ctf}
      POSTGRES_USER: ${POSTGRES_USER:-mini_ctf_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-mini_ctf_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - mini-ctf-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mini-ctf-postgres:
