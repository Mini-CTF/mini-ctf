services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-ctf-postgres
    environment:
      POSTGRES_DB: mini_ctf
      POSTGRES_USER: mini_ctf
      POSTGRES_PASSWORD: change-this-password
    ports:
      - "5432:5432"
    volumes:
      - mini-ctf-postgres:/var/lib/postgresql/data

volumes:
  mini-ctf-postgres:
