services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-ctf-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mini_ctf}
      POSTGRES_USER: ${POSTGRES_USER:-mini_ctf}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - mini-ctf-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mini-ctf-postgres:
